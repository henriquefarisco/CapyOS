name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing CapyOS tag to build (v<version>)"
        required: true
        type: string
      publish_github_release:
        description: "Create or update the draft GitHub Release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-iso:
    name: Build ISO artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^#define CAPYOS_VERSION_FULL[[:space:]]*"\([^"]*\)"/\1/p' include/core/version.h)"
          if [ -z "$VERSION" ]; then
            echo "Unable to resolve CAPYOS_VERSION_FULL"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG_INPUT"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag/version mismatch: tag=$TAG version=$VERSION"
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Tag does not point to checked-out HEAD: tag=$TAG_COMMIT head=$HEAD_COMMIT"
            exit 1
          fi
          BUILD_DATE="${VERSION##*+}"
          if [[ "$BUILD_DATE" =~ ^[0-9]{8}$ ]]; then
            PUBLISHED_AT="${BUILD_DATE:0:4}-${BUILD_DATE:4:2}-${BUILD_DATE:6:2}"
          else
            PUBLISHED_AT="$(git show -s --format=%cs HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned release siblings
        shell: bash
        env:
          CAPYAI_DEPLOY_KEY: ${{ secrets.CAPYAI_DEPLOY_KEY }}
        run: bash tools/scripts/checkout_release_siblings.sh

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-x86-64-linux-gnu \
            build-essential \
            gcc-x86-64-linux-gnu \
            gnu-efi \
            make \
            xorriso

      - name: Verify dependencies
        run: python3 tools/scripts/check_deps.py --allow-fallback-toolchain

      - name: Verify pinned graphical browser build plan
        shell: bash
        run: bash tools/scripts/verify_release_siblings.sh plan

      - name: Validate build and produce ISO
        run: |
          make test
          make layout-audit
          make version-audit
          make all64 TOOLCHAIN64=host
          make iso-uefi TOOLCHAIN64=host
          make verify-release-checksums TOOLCHAIN64=host

      - name: Verify linked graphical browser siblings
        shell: bash
        run: bash tools/scripts/verify_release_siblings.sh linked

      - name: Build aggregate module index
        shell: bash
        run: bash tools/scripts/build_release_modules.sh "${{ steps.release.outputs.tag }}"

      - name: Resolve ISO path
        id: iso
        shell: bash
        run: |
          ISO_PATH="$(cat build/CapyOS-Installer-UEFI.last-built.txt)"
          if [ ! -f "$ISO_PATH" ]; then
            echo "ISO path not found: $ISO_PATH"
            exit 1
          fi
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify update manifest signing contract
        run: python3 tools/scripts/verify_update_manifest.py --self-test

      - name: Prepare deterministic offline update-signing handoff
        id: update
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          PUBLISHED_AT="${{ steps.release.outputs.published_at }}"
          TAG="${{ steps.release.outputs.tag }}"
          PAYLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/capyos64.bin"
          mkdir -p build/update
          python3 tools/scripts/build_update_manifest.py \
            --unsigned \
            --version "$VERSION" \
            --channel stable \
            --branch main \
            --source "github:${GITHUB_REPOSITORY}" \
            --published-at "$PUBLISHED_AT" \
            --payload build/capyos64.bin \
            --payload-url "$PAYLOAD_URL" \
            --output build/update/latest.unsigned.ini \
            --force
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "payload_url=$PAYLOAD_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Offline update manifest handoff"
            echo ""
            echo "The artifact contains capyos64.bin, manifest.bin and latest.unsigned.ini."
            echo "The private Ed25519 key is intentionally never available to this workflow."
            echo "An offline operator must sign the exact payload with build_update_manifest.py,"
            echo "verify latest.ini with verify_update_manifest.py, then upload latest.ini separately."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage exact GitHub Release asset set
        id: release_stage
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="build/release-stage"
          ISO_PATH="${{ steps.iso.outputs.iso_path }}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          mapfile -d '' AI_ASSETS < <(
            find build/capypkg -maxdepth 1 -type f \
              -name 'org.capyos.ai.assistant-*.bin' -print0
          )
          if [ "${#AI_ASSETS[@]}" -ne 1 ]; then
            echo "Expected exactly one CapyAI payload, got ${#AI_ASSETS[@]}"
            exit 1
          fi

          SOURCES=(
            "$ISO_PATH"
            build/capyos64.bin
            build/manifest.bin
            build/capypkg/modules-index.txt
            "${AI_ASSETS[0]}"
            build/capypkg/modules.sha256
          )
          for source in "${SOURCES[@]}"; do
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              echo "Invalid release asset source: $source"
              exit 1
            fi
            cp -- "$source" "$STAGE_DIR/$(basename "$source")"
          done

          (
            cd "$STAGE_DIR"
            mapfile -t PAYLOADS < <(
              find . -maxdepth 1 -type f ! -name release-artifacts.sha256 \
                -printf '%f\n' | LC_ALL=C sort
            )
            if [ "${#PAYLOADS[@]}" -ne 6 ]; then
              echo "Expected exactly six payload assets, got ${#PAYLOADS[@]}"
              exit 1
            fi
            sha256sum -c modules.sha256
            sha256sum "${PAYLOADS[@]}" > release-artifacts.sha256
            sha256sum -c release-artifacts.sha256
          )

          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload ISO and offline update inputs as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capyos-iso-${{ github.run_id }}
          path: |
            build/release-stage/*
            build/CapyOS-Installer-UEFI.last-built.txt
            build/update/latest.unsigned.ini
          if-no-files-found: error
          retention-days: 14

      - name: Refuse to mutate an already-published release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          LOOKUP_ERROR="build/release-lookup.err"
          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,tagName,isDraft,isPrerelease,isImmutable,assets \
            > build/release-existing.json 2>"$LOOKUP_ERROR"; then
            EXISTING_DRAFT="$(jq -r '.isDraft' build/release-existing.json)"
            if [ "$EXISTING_DRAFT" != "true" ]; then
              echo "Refusing to replace already-published release $TAG"
              exit 1
            fi
            if jq -e 'any(.assets[]; .name == "latest.ini" or .name == "release-artifacts.sha256.sig" or .name == "release-ed25519.pub.pem" or .name == "release-public-key.manifest" or .name == "release-publication.manifest")' \
              build/release-existing.json >/dev/null; then
              echo "Refusing to replace payloads after offline signed materials were attached"
              exit 1
            else
              JQ_STATUS=$?
              if [ "$JQ_STATUS" -ne 1 ]; then
                echo "Unable to inspect the existing draft asset inventory"
                exit 1
              fi
            fi
          elif ! grep -Fxq 'release not found' "$LOOKUP_ERROR"; then
            cat "$LOOKUP_ERROR" >&2
            exit 1
          fi

      - name: Upload GitHub Release assets as a draft
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_github_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: build/release-stage/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
          make_latest: false

      - name: Re-download and verify the authenticated draft
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_github_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_STAGE_DIR: ${{ steps.release_stage.outputs.stage_dir }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          STAGE_DIR="$RELEASE_STAGE_DIR"
          DRAFT_DIR="build/release-draft-download"

          DRAFT_STATUS="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft')"
          if [ "$DRAFT_STATUS" != "true" ]; then
            echo "Release is not an unpublished draft"
            exit 1
          fi

          draft_downloaded=false
          for attempt in 1 2 3 4 5; do
            rm -rf "$DRAFT_DIR"
            mkdir -p "$DRAFT_DIR"
            if gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$DRAFT_DIR" \
              --clobber; then
              draft_downloaded=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep "$((attempt * 2))"
            fi
          done
          if [ "$draft_downloaded" != true ]; then
            echo "Unable to download the authenticated draft after bounded retries"
            exit 1
          fi

          find "$STAGE_DIR" -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > build/release-stage-assets.txt
          find "$DRAFT_DIR" -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > build/release-draft-assets.txt
          diff -u build/release-stage-assets.txt build/release-draft-assets.txt

          while IFS= read -r asset; do
            cmp --silent "$STAGE_DIR/$asset" "$DRAFT_DIR/$asset"
          done < build/release-stage-assets.txt
          (
            cd "$DRAFT_DIR"
            sha256sum -c modules.sha256
            sha256sum -c release-artifacts.sha256
          )

          python3 tools/scripts/verify_modules_index_assets.py \
            --index "$DRAFT_DIR/modules-index.txt" \
            --release-tag "$TAG" \
            --local-payload-dir "$DRAFT_DIR" \
            --allow-unsigned-index \
            --attempts 5 \
            --backoff-seconds 1 \
            --timeout 45

      - name: Record the offline signing boundary
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_github_release == 'true'
        shell: bash
        run: |
          {
            echo "### Draft verified; offline signatures required"
            echo ""
            echo "The GitHub Release remains an unpublished draft by design."
            echo "Replace modules-index.txt with its offline-signed form and recompute"
            echo "modules.sha256 plus release-artifacts.sha256. Then upload the signed"
            echo "checksum, approved release public key, public manifests and latest.ini"
            echo "before running the Promote Signed Release workflow."
            echo "No tag workflow is allowed to mark an unsigned draft as Latest."
          } >> "$GITHUB_STEP_SUMMARY"
